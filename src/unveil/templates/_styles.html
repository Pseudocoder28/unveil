<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --ink: #16181d; --muted: #5d6470; --line: #e3e6eb;
  --crit: #b4232a; --crit-bg: #fde8e9; --high: #c2410c; --high-bg: #fff0e6;
  --med: #a16207; --med-bg: #fef6dc; --low: #0e7490; --low-bg: #e4f6fa; --info: #6b7280; --info-bg: #f1f2f4;
  --ok: #15803d; --ok-bg: #e5f6ea; --accent: #2b59c3;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111317; --card: #1a1d23; --ink: #e8eaee; --muted: #9aa2ad; --line: #2b3038;
    --crit: #ff6b6b; --crit-bg: #3a1618; --high: #ff9a5c; --high-bg: #3a2214; --med: #f2c94c; --med-bg: #362c10;
    --low: #5fd0e6; --low-bg: #12303a; --info: #9aa2ad; --info-bg: #23272e; --ok: #5ad17f; --ok-bg: #13301d; --accent: #7aa2ff;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
.wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
a { color: var(--accent); }
header.top { display: flex; align-items: center; gap: 16px; justify-content: space-between; margin-bottom: 20px; }
header.top .brand { font-weight: 700; font-size: 18px; letter-spacing: -0.01em; text-decoration: none; color: var(--ink); }
header.top nav a { margin-left: 16px; text-decoration: none; color: var(--muted); }
header.top nav a:hover { color: var(--ink); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.verdict { display: flex; gap: 16px; align-items: flex-start; }
.verdict .badge { flex: none; font-weight: 700; font-size: 13px; letter-spacing: .04em; text-transform: uppercase;
  padding: 6px 10px; border-radius: 8px; }
.v-malicious .badge { background: var(--crit); color: #fff; }
.v-suspicious .badge { background: var(--med); color: #fff; }
.v-clean .badge { background: var(--ok); color: #fff; }
.verdict h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.01em; }
.verdict .meta { color: var(--muted); font-size: 13px; word-break: break-all; }
.score { margin-left: auto; text-align: right; flex: none; }
.score b { font-size: 28px; display: block; line-height: 1; }
.score span { color: var(--muted); font-size: 12px; }
.counts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.pill { font-size: 12px; padding: 3px 9px; border-radius: 999px; font-weight: 600; }
.s-critical { background: var(--crit-bg); color: var(--crit); }
.s-high { background: var(--high-bg); color: var(--high); }
.s-medium { background: var(--med-bg); color: var(--med); }
.s-low { background: var(--low-bg); color: var(--low); }
.s-info { background: var(--info-bg); color: var(--info); }
.banner { border-radius: 10px; padding: 12px 14px; margin-top: 14px; font-size: 14px; }
.banner.blocked { background: var(--crit-bg); color: var(--crit); font-weight: 600; }
.banner.watch { background: var(--med-bg); color: var(--med); }
.banner.ok { background: var(--ok-bg); color: var(--ok); }
.banner form { display: inline; }
h2 { font-size: 16px; margin: 0 0 12px; }
.finding { border-top: 1px solid var(--line); padding: 14px 0; }
.finding:first-of-type { border-top: 0; padding-top: 0; }
.finding .head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.finding .title { font-weight: 600; }
.finding .loc { color: var(--muted); font-size: 13px; font-family: var(--mono); }
.finding pre { white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--line);
  border-left: 3px solid var(--crit); border-radius: 6px; padding: 10px 12px; margin: 10px 0 6px; font: 13px/1.45 var(--mono); }
.finding.sev-high pre { border-left-color: var(--high); }
.finding.sev-medium pre { border-left-color: var(--med); }
.finding.sev-low pre, .finding.sev-info pre { border-left-color: var(--line); }
.finding .why { color: var(--muted); font-size: 13px; }
.tags { margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 11px; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
details.info summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.evidence { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.evidence figure { margin: 0; }
.evidence img { width: 100%; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
.evidence figcaption { font-size: 12px; color: var(--muted); margin-top: 4px; }
.safe { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.btn { display: inline-block; border: 0; border-radius: 8px; padding: 9px 14px; font-weight: 600; font-size: 14px;
  background: var(--accent); color: #fff; text-decoration: none; cursor: pointer; }
.btn.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.danger { background: var(--crit); }
.notes { color: var(--muted); font-size: 13px; margin: 8px 0 0; padding-left: 18px; }
table.list { width: 100%; border-collapse: collapse; font-size: 14px; }
table.list th, table.list td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
table.list th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; border-top: 0; }
.footer { color: var(--muted); font-size: 12px; margin-top: 24px; }
@media (max-width: 600px) {
  .verdict { flex-wrap: wrap; }
  .score { margin-left: 0; text-align: left; }
  table.list { font-size: 13px; }
}
</style>
